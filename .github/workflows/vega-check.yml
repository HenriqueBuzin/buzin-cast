name: Buzin Cast - verificar fontes Vega

on:
  workflow_dispatch:
  pull_request:
    paths: ['vega/**', 'tools/prepare_vega_airplay.py', 'tools/test_prepare_vega_airplay.py', 'tools/test_vega.py', 'tools/test_vega_msse.py', 'tools/test_vega_msse_video.py', 'tools/test_vega_local_video.py', 'tools/test_vega_mirror_crypto.py', 'tools/test_vega_alac_decoder.py', 'fireos3-probe/src/main/assets/audio_samples.json', 'app/src/main/cpp/third_party/ffmpeg', 'tools/test_vega_airplay_audio.py', 'app/src/main/cpp/patches/UxPlay/**', '.github/workflows/vega-check.yml']
  push:
    branches: [main]
    paths: ['vega/**', 'tools/prepare_vega_airplay.py', 'tools/test_prepare_vega_airplay.py', 'tools/test_vega.py', 'tools/test_vega_msse.py', 'tools/test_vega_msse_video.py', 'tools/test_vega_local_video.py', 'tools/test_vega_mirror_crypto.py', 'tools/test_vega_alac_decoder.py', 'fireos3-probe/src/main/assets/audio_samples.json', 'app/src/main/cpp/third_party/ffmpeg', 'tools/test_vega_airplay_audio.py', 'app/src/main/cpp/patches/UxPlay/**', '.github/workflows/vega-check.yml']

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vega
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: vega/.nvmrc
          cache: npm
          cache-dependency-path: vega/package-lock.json
      - name: Preparar núcleo AirPlay isolado
        run: |
          git -C .. submodule update --init --depth 1 app/src/main/cpp/third_party/UxPlay app/src/main/cpp/third_party/ffmpeg app/src/main/cpp/third_party/libplist
          python3 ../tools/test_prepare_vega_airplay.py
          python3 -m py_compile ../tools/test_vega.py ../tools/test_vega_msse.py ../tools/test_vega_msse_video.py ../tools/test_vega_local_video.py ../tools/test_vega_airplay_audio.py
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - name: Testar transporte FCast com sockets reais
        run: |
          mkdir -p ../build/vega-native-tests
          clang++ -std=c++23 -Wall -Wextra -Werror -pthread -Ikepler/turbo-modules test/FCastTransportTest.cpp kepler/turbo-modules/FCastTransport.cpp -o ../build/vega-native-tests/fcast-transport
          ../build/vega-native-tests/fcast-transport
      - name: Testar pacotes DNS-SD sem anúncios na rede
        run: |
          mkdir -p ../build/vega-native-tests
          clang++ -std=c++23 -Wall -Wextra -Werror -pthread test/FCastDiscoveryTest.cpp kepler/turbo-modules/ReceiverSettings.cpp -o ../build/vega-native-tests/fcast-discovery
          ../build/vega-native-tests/fcast-discovery
      - name: Testar fila e relógio de áudio AirPlay
        run: |
          mkdir -p ../build/vega-native-tests
          clang++ -std=c++23 -Wall -Wextra -Werror -pthread test/AirPlayAudioWorkerTest.cpp kepler/turbo-modules/AirPlayAudioWorker.cpp -o ../build/vega-native-tests/airplay-audio-worker
          ../build/vega-native-tests/airplay-audio-worker
      - name: Testar servidor local de vídeo e cancelamento
        run: |
          mkdir -p ../build/vega-native-tests
          clang++ -std=c++23 -Wall -Wextra -Werror -pthread test/LocalVideoStreamTest.cpp kepler/turbo-modules/LocalVideoStream.cpp -o ../build/vega-native-tests/local-video-stream
          ../build/vega-native-tests/local-video-stream
      - name: Testar callbacks, gerações e fila de vídeo AirPlay
        run: |
          clang++ -std=c++23 -Wall -Wextra -Werror -pthread -Igenerated/UxPlay/lib test/AirPlayVideoWorkerTest.cpp kepler/turbo-modules/AirPlayVideoWorker.cpp -o ../build/vega-native-tests/airplay-video-worker
          ../build/vega-native-tests/airplay-video-worker
      - name: Testar estado AES-CTR do espelhamento
        run: python3 ../tools/test_vega_mirror_crypto.py
      - name: Testar ALAC e MP4 incremental com FFmpeg fixado
        run: python3 ../tools/test_vega_alac_decoder.py
      - name: Testar persistência do nome
        run: |
          mkdir -p ../build/vega-native-tests
          clang++ -std=c++23 -Wall -Wextra -Werror -Ikepler/turbo-modules test/ReceiverSettingsTest.cpp kepler/turbo-modules/ReceiverSettings.cpp -o ../build/vega-native-tests/receiver-settings
          ../build/vega-native-tests/receiver-settings
      - name: Conferir cópia da arte aprovada
        run: cmp src/assets/buzin_banner.png ../app/src/main/res/drawable-nodpi/buzin_banner.png
      - name: Conferir ícone aprovado
        run: cmp assets/image/buzin_launcher.png ../app/src/main/res/mipmap-xxxhdpi/buzin_launcher.png
