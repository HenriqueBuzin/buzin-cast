schema-version = 1

[package]
title = "Buzin Cast"
icon = "@image/buzin_launcher.png"
version = "0.6.0"
# Floor so local builds pass vpt validate; pass an increasing --build-number for every Appstore upload.
build-number = 1
id = "com.buzincast.tv"

[os.version]
min = "2.0"
target = "2.0"

[components]
[[components.interactive]]
id = "com.buzincast.tv.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

# Required by the documented W3C media pipeline, including shared buffers.
[needs]
[[needs.privilege]]
id = "com.amazon.media.secureplayback"
[[needs.privilege]]
id = "com.amazon.privilege.security.file-sharing"

[wants]
[[wants.service]]
id = "com.amazon.mediametrics.service"
[[wants.service]]
id = "com.amazon.mediabuffer.service"
[[wants.service]]
id = "com.amazon.mediatransform.service"
[[wants.service]]
id = "com.amazon.audio.stream"
[[wants.service]]
id = "com.amazon.audio.control"
[[wants.service]]
id = "com.amazon.audio.system"
[[wants.service]]
id = "com.amazon.gipc.uuid.*"
[[wants.service]]
id = "com.amazon.media.server"
[[wants.service]]
id = "com.amazon.media.playersession.service"

[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*"
